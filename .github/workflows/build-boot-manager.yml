name: Build Outlaw OS

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            V="${{ github.event.release.tag_name }}"
          else
            V="v$(node -e "console.log(require('./outlaw-shell/package.json').version)")"
          fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: ${V#v}"

      # Auto-bump outlaw-shell/package.json to match the release tag so the
      # self-updater's semver compare works the moment users install it.
      - name: Sync shell version to release tag
        if: github.event_name == 'release'
        run: |
          V="${{ steps.ver.outputs.version }}"
          node -e "const f='outlaw-shell/package.json';const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n');"
          cat outlaw-shell/package.json | head -n5

      - name: Build the shell tarball (OTA update payload)
        run: |
          mkdir -p out
          NAME="outlaw-shell-v${{ steps.ver.outputs.version }}.tar.gz"
          tar -C outlaw-shell --exclude='node_modules' --exclude='dist' --exclude='out' -czf "out/$NAME" .
          (cd out && sha256sum "$NAME" > "$NAME.sha256")
          ls -lh out/

      - name: Build Outlaw OS ISO
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            archlinux:latest bash -c '
              set -e
              pacman -Syu --noconfirm archiso git
              cd outlaw-installer
              chmod +x build.sh
              ./build.sh
            '

      - name: Locate built ISO
        id: locate
        run: |
          ISO_PATH=$(find ./out -maxdepth 1 -name "outlaw-os-*.iso" -type f | head -n 1)
          if [ -z "$ISO_PATH" ]; then echo "❌ ISO not created"; exit 1; fi
          echo "iso_path=$ISO_PATH" >> "$GITHUB_ENV"
          echo "Built: $ISO_PATH"

      - name: Upload artifacts to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./out/outlaw-os-*.iso
            ./out/outlaw-os-*.iso.sha256
            ./out/outlaw-shell-*.tar.gz
            ./out/outlaw-shell-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to workflow run
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: outlaw-os
          path: |
            ./out/outlaw-os-*.iso
            ./out/outlaw-shell-*.tar.gz
            ./out/*.sha256
