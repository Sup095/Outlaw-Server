# ============================================================================
# Outlaw Server — automated ISO build
# ----------------------------------------------------------------------------
# Fires on a tag push (v* or V*) → builds the ISO in the official archlinux
# container and attaches outlaw-server-v<version>.iso + its .sha256 to the
# matching GitHub Release. workflow_dispatch produces a downloadable artifact
# only. Flat repo layout: the installer tree is at ./outlaw-installer.
# ============================================================================
name: build-iso

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  INSTALLER_DIR: outlaw-installer
  # build.sh writes the ISO to $REPO_ROOT/out (parent of outlaw-installer).
  OUTPUT_DIR: out

jobs:
  preflight:
    name: Validate package names
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Pull the Arch container (with retry)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            docker pull archlinux:latest && exit 0
            echo "::warning::archlinux:latest pull attempt $i failed; retrying in 20s…"
            sleep 20
          done
          echo "::error::Could not pull archlinux:latest after 6 attempts."
          exit 1
      - name: Validate every package resolves in the Arch repos
        run: |
          set -e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e INSTALLER_DIR="$INSTALLER_DIR" \
            archlinux:latest bash /work/.github/ci/preflight-in-container.sh

  build:
    name: Build Outlaw Server ISO
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Make the build scripts executable
        run: |
          set -e
          chmod +x "$INSTALLER_DIR/build.sh"
          # bundle-codemaker.sh is not used here (no CodeMaker in this repo) but
          # build.sh may reference it — chmod defensively if present.
          [ -f "$INSTALLER_DIR/bundle-codemaker.sh" ] && chmod +x "$INSTALLER_DIR/bundle-codemaker.sh" || true
          find "$INSTALLER_DIR/airootfs/usr/local/bin" -type f -exec chmod +x {} +

      - name: Derive ISO version from tag
        id: ver
        run: |
          REF="${GITHUB_REF_NAME:-}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${REF#v}"; VERSION="${VERSION#V}"
            echo "iso_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Using ISO_VERSION=$VERSION (from tag $REF)"
          else
            echo "iso_version=" >> "$GITHUB_OUTPUT"
            echo "No tag — build.sh uses its built-in default."
          fi

      - name: Pull the Arch container (with retry)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            docker pull archlinux:latest && exit 0
            echo "::warning::archlinux:latest pull attempt $i failed; retrying in 20s…"
            sleep 20
          done
          echo "::error::Could not pull archlinux:latest after 6 attempts."
          exit 1

      - name: Build the ISO (inside the Arch container)
        run: |
          set -eo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e INSTALLER_DIR="$INSTALLER_DIR" \
            -e OUTPUT_DIR="$OUTPUT_DIR" \
            -e OUTLAW_ISO_VERSION="${{ steps.ver.outputs.iso_version }}" \
            archlinux:latest bash /work/.github/ci/build-in-container.sh
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/$OUTPUT_DIR" "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ github.run_id }}
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Locate built artifacts
        id: artifacts
        run: |
          ISO_ABS=$(ls -1 "$GITHUB_WORKSPACE/$OUTPUT_DIR"/outlaw-server-v*.iso 2>/dev/null | head -n1 || true)
          if [[ -z "$ISO_ABS" || ! -f "$ISO_ABS" ]]; then
            echo "::error::ISO not produced under $OUTPUT_DIR — check the build log above." >&2
            ls -lh "$GITHUB_WORKSPACE/$OUTPUT_DIR" 2>&1 || true
            exit 1
          fi
          SHA_ABS="$ISO_ABS.sha256"
          ISO_NAME=$(basename "$ISO_ABS")
          echo "iso_rel=${ISO_ABS#$GITHUB_WORKSPACE/}" >> "$GITHUB_OUTPUT"
          echo "sha_rel=${SHA_ABS#$GITHUB_WORKSPACE/}" >> "$GITHUB_OUTPUT"
          echo "iso_name=$ISO_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO_ABS" "$SHA_ABS"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.artifacts.outputs.iso_name }}
          path: |
            ${{ steps.artifacts.outputs.iso_rel }}
            ${{ steps.artifacts.outputs.sha_rel }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.iso_rel }}
            ${{ steps.artifacts.outputs.sha_rel }}
          generate_release_notes: true
          # Everything stays a pre-release until a clean non-alpha/beta tag ships.
          prerelease: ${{ contains(github.ref_name, 'lpha') || contains(github.ref_name, 'eta') }}
          body: |
            ## Outlaw Server ${{ github.ref_name }}

            > **Pre-alpha.** This is an early build of the stripped-down Outlaw Server
            > OS — expect rough edges. See the README for the roadmap.

            **Burn this ISO to a USB drive, boot it, and install.**

            ### Install
            1. Download `${{ steps.artifacts.outputs.iso_name }}` below.
            2. Burn it to an 8 GB+ USB stick:
               - **Windows:** [Rufus](https://rufus.ie/) — pick the ISO + your USB, Start.
               - **Linux/macOS:** `dd if=${{ steps.artifacts.outputs.iso_name }} of=/dev/sdX bs=4M status=progress`
            3. Boot from the USB (F12 / F2 / Del at startup).
            4. Install to disk, then manage the server from your browser.

            ### Verify (recommended)
            ```bash
            sha256sum -c ${{ steps.artifacts.outputs.iso_name }}.sha256
            ```
