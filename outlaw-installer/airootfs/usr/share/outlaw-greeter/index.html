<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none';">
    <title>Outlaw OS</title>
    <style>
        /* Phase 14h — default palette = the desktop shell's GREEN phosphor theme.
           The chooser recolors to gold / broken when the desktop is set to those
           (body.theme-gold / body.theme-broken, applied by renderer.js from the
           ~/.outlaw-theme the shell mirrors). The boot intro below stays green —
           a fixed identity moment — regardless of theme. */
        :root {
            --bg:       #050705;
            --bg-alt:   #0a0e0a;
            --panel:    #0a0e0a;
            --panel-hi: #0d130d;
            --border:   #143d0d;
            --text:     #b9ffb0;
            --muted:    #5f9e57;
            --accent:   #33ff00;
            --accent2:  #7dff66;
            --accent-dim: #1a8000;
            --accent-rgb: 51, 255, 0;
        }
        /* Gold-on-gunmetal — mirrors the shell's body.theme-gold palette. */
        body.theme-gold {
            --bg:       #0b0e14;
            --bg-alt:   #11151f;
            --panel:    #12161f;
            --panel-hi: #1a2130;
            --border:   #2a3242;
            --text:     #e6dcc0;
            --muted:    #838c9c;
            --accent:   #e0b341;
            --accent2:  #f4d27a;
            --accent-dim: #7d6526;
            --accent-rgb: 224, 179, 65;
        }
        /* "Broken" — sickly washed-out phosphor with failing-red hairlines.
           Palette only here (no flicker FX) to keep the boot screen rock-solid. */
        body.theme-broken {
            --bg:       #060806;
            --bg-alt:   #0b0f0b;
            --panel:    #0b0f0b;
            --panel-hi: #0e140e;
            --border:   #6b1b1b;
            --text:     #9ad48f;
            --muted:    #5f7d5a;
            --accent:   #4be04b;
            --accent2:  #6be06b;
            --accent-dim: #2a7a2a;
            --accent-rgb: 75, 224, 75;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
            font-size: 12pt;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 22px 28px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background:
                radial-gradient(circle at 50% -10%, rgba(var(--accent-rgb), 0.10), transparent 60%),
                linear-gradient(180deg, var(--bg-alt) 0%, var(--bg) 100%);
        }
        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .brand {
            font-size: 16pt;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--accent2);
        }
        .brand .star { color: var(--accent); margin-right: 8px; }
        .tag { color: var(--muted); font-size: 10pt; }
        h1 {
            font-size: 14pt;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }
        .lede {
            color: var(--muted);
            font-size: 10.5pt;
            margin-bottom: 16px;
        }
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }
        button.card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-align: left;
            padding: 18px 18px 16px;
            cursor: pointer;
            transition: transform 80ms ease, border-color 100ms ease, background 100ms ease;
            font-family: inherit;
            font-size: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            outline: none;
        }
        button.card:hover,
        button.card:focus-visible {
            background: var(--panel-hi);
            border-color: var(--accent);
        }
        button.card:active { transform: translateY(1px); }
        .card .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card .ico {
            font-size: 22pt;
            line-height: 1;
        }
        .card .title {
            font-size: 13pt;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }
        .card .desc {
            color: var(--muted);
            font-size: 10pt;
            line-height: 1.5;
        }
        .card .pill {
            display: inline-block;
            font-size: 8pt;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #1a1407;
            background: var(--accent2);
            border-radius: 4px;
            padding: 2px 6px;
            margin-top: 4px;
            width: fit-content;
        }
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: var(--muted);
            font-size: 9pt;
        }
        a.muted-link {
            color: var(--muted);
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px dotted var(--muted);
        }
        a.muted-link:hover { color: var(--accent2); border-bottom-color: var(--accent2); }
        .hint { letter-spacing: 0.5px; }
        label.remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 9pt;
            cursor: pointer;
        }
        label.remember:hover { color: var(--text); }
        label.remember input[type="checkbox"] {
            accent-color: var(--accent);
            width: 13px;
            height: 13px;
            cursor: pointer;
        }
        /* Phase 8 — cinematic boot intro (always green + CRT, a fixed identity
           moment) shown before the chooser. Skippable; auto-reveals the chooser. */
        #boot-intro {
            position: fixed; inset: 0; z-index: 50; background: #050705; color: #33ff00;
            display: flex; flex-direction: column; padding: 18px 22px; overflow: hidden;
        }
        #boot-intro.hide { display: none; }
        #boot-intro::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
            background: repeating-linear-gradient(0deg,
                rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,30,0,0.30) 3px, rgba(0,0,0,0) 4px);
        }
        #bi-sigil {
            position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 92px;
            line-height: 1; color: #33ff00; opacity: 0; z-index: 2;
            text-shadow: 0 0 16px rgba(51,255,0,0.6), 0 0 38px rgba(51,255,0,0.3);
        }
        #bi-sigil.warm { animation: bi-warm 2.6s ease-out forwards; }
        @keyframes bi-warm {
            0%{opacity:0} 9%{opacity:.5} 13%{opacity:.08} 19%{opacity:.8} 24%{opacity:.16}
            32%{opacity:1} 38%{opacity:.5} 48%{opacity:1} 100%{opacity:.9}
        }
        #bi-log { white-space: pre-wrap; line-height: 1.55; font-size: 10.5pt; flex: 1;
            position: relative; z-index: 1; overflow: hidden; }
        #bi-skip { position: absolute; bottom: 12px; right: 20px; color: #2c7a2c; font-size: 9pt; z-index: 4; }
        .preflight {
            margin-top: 10px; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 9px 12px; font-size: 9.5pt; color: var(--muted);
            line-height: 1.6; display: none;
        }
        .preflight.show { display: block; }
        .preflight b { color: var(--accent2); }
        .preflight .warn { color: var(--accent); }
        /* Lock gate — PIN before the picker (only shown when a PIN + lock are set). */
        #greeter-lock {
            position: fixed; inset: 0; z-index: 60;
            background: linear-gradient(180deg, var(--bg-alt) 0%, var(--bg) 100%);
            display: flex; align-items: center; justify-content: center;
        }
        #greeter-lock[hidden] { display: none; }
        .lock-card { width: 280px; text-align: center; }
        .lock-title { font-size: 13pt; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
        .lock-sub { color: var(--muted); font-size: 10pt; margin-bottom: 16px; }
        .pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }
        .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--accent-dim); }
        .pin-dots span.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .keypad { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; justify-content: center; }
        .keypad button { height: 50px; font-size: 14pt; font-family: inherit; background: var(--panel);
            color: var(--text); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
        .keypad button:hover { border-color: var(--accent); background: var(--panel-hi); }
        .keypad button[data-d="back"], .keypad button[data-d="ok"] { color: var(--muted); }
        .lock-err { color: var(--accent); font-size: 9.5pt; min-height: 16px; margin-top: 12px; }
        .lock-pw { margin-top: 12px; display: none; gap: 8px; }
        .lock-pw.show { display: flex; }
        .lock-pw input { flex: 1; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); padding: 8px 10px; font-family: inherit; }
        .lock-pw button { background: var(--accent); color: #0a0a0a; border: none; border-radius: 8px;
            padding: 8px 14px; cursor: pointer; font-family: inherit; font-weight: 700; }
        #lock-usepw { display: inline-block; margin-top: 14px; }
    </style>
</head>
<body>
    <div id="boot-intro">
        <div id="bi-sigil" aria-hidden="true">⌬</div>
        <div id="bi-log"></div>
        <div id="bi-skip">press any key to skip</div>
    </div>

    <header>
        <div class="brand"><span class="star">⟁</span>OUTLAW_OS</div>
        <div class="tag">// SESSION SELECT</div>
    </header>

    <h1>What are you here to do?</h1>
    <div class="lede">Pick once per boot. You can flip later from Settings &rarr; Session.</div>

    <div class="choices">
        <button class="card" data-choice="dev" autofocus>
            <div class="row">
                <span class="ico">🛠</span>
                <span class="title">Dev session</span>
            </div>
            <div class="desc">
                Open <strong>Outlaw CodeMaker</strong> — the AI agent that builds
                Godot games with you. LM Studio runs the model.
            </div>
            <span class="pill">Make a game</span>
        </button>

        <button class="card" data-choice="desktop">
            <div class="row">
                <span class="ico">⌂</span>
                <span class="title">Desktop</span>
            </div>
            <div class="desc">
                Open the standard shell — browser, files, terminal, Steam,
                Apps panel, on-device AI assistant.
            </div>
            <span class="pill">Use the OS</span>
        </button>
    </div>

    <div class="preflight" id="preflight-out"></div>

    <footer>
        <label class="remember">
            <input type="checkbox" id="remember-choice">
            <span>Always start in this session (skip this screen on future boots)</span>
        </label>
        <span class="hint">↹ TAB · ENTER to choose</span>
        <a class="muted-link" data-action="preflight">🔍 check this PC</a>
        <a class="muted-link" data-choice="tty">drop to a terminal</a>
    </footer>

    <div id="greeter-lock" hidden>
        <div class="lock-card">
            <div class="lock-title">🔒 Enter your PIN</div>
            <div class="lock-sub" id="lock-sub">Unlock to choose a session</div>
            <div class="pin-dots" id="lock-dots"><span></span><span></span><span></span><span></span></div>
            <div class="keypad" id="lock-keypad">
                <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
                <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
                <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
                <button data-d="back">⌫</button><button data-d="0">0</button><button data-d="ok">↵</button>
            </div>
            <div class="lock-err" id="lock-err"></div>
            <div class="lock-pw" id="lock-pw-wrap">
                <input type="password" id="lock-pw" placeholder="Account password" autocomplete="off">
                <button id="lock-pw-go" type="button">Unlock</button>
            </div>
            <a class="muted-link" id="lock-usepw">Use account password instead</a>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
