# Outlaw OS compositor — intentionally minimal.
# Goal: eliminate screen tearing WITHOUT any visual distortion. No shadows,
# no blur, no fading, no opacity changes — so apps and games render exactly
# as intended, with no scanlines or colour shift from the compositor.
backend = "glx";
vsync = true;
shadow = false;
fading = false;
blur-background = false;
detect-client-opacity = false;
use-damage = true;
# Let fullscreen games bypass the compositor for max performance / no input lag.
unredir-if-possible = true;
