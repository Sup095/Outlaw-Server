# ============================================================================
# Outlaw OS - pacman configuration used to build the ISO and install the OS.
# Signature checking is REQUIRED (no TrustAll) so packages are verified.
# multilib is enabled for Steam / 32-bit gaming libraries.
# ============================================================================
[options]
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
